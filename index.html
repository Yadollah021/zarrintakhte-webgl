<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Zarrin Takhte">
    <meta name="theme-color" content="#f2e3af">
    <meta name="screen-orientation" content="portrait-primary">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Zarrin Takhte">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" sizes="192x192" href="icon-192.png">
    <link rel="icon" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <title>Zarrin Takhte</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #151216;
        color: #fff;
        font-family: Arial, sans-serif;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #unity-container {
        position: fixed;
        left: 50%;
        top: 50%;
        width: min(100vw, calc(100dvh * 9 / 16));
        height: min(100dvh, calc(100vw * 16 / 9));
        transform: translate(-50%, -50%);
        padding:
          env(safe-area-inset-top)
          env(safe-area-inset-right)
          env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
        background: #151216;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.45);
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #151216;
        outline: none;
      }

      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(72vw, 360px);
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 10;
      }

      #unity-logo {
        width: 96px;
        height: 96px;
        margin: 0 auto 22px;
        border-radius: 24px;
        background: #f2e3af url("TemplateData/app-icon.png") center / contain no-repeat;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      }

      #unity-progress-bar-empty {
        width: 100%;
        height: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
      }

      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #f4d991, #d8a344);
        transition: width 160ms ease;
      }

      #unity-warning {
        position: absolute;
        left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right));
        top: max(12px, env(safe-area-inset-top));
        z-index: 20;
        display: none;
        font-size: 13px;
        line-height: 1.4;
      }

      #unity-warning div {
        margin-bottom: 8px;
        border-radius: 8px;
        padding: 10px 12px;
        color: #101010;
      }

      #rotate-warning {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #151216;
        text-align: center;
        font-size: 18px;
        line-height: 1.7;
      }

      @media (orientation: landscape) and (max-height: 540px) and (pointer: coarse) {
        #rotate-warning {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=440 height=956 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo" aria-hidden="true"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="rotate-warning">لطفاً گوشی را عمودی بگیرید</div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var fullscreenRequested = false;

      function lockViewport() {
        var viewportWidth = Math.max(1, window.innerWidth || document.documentElement.clientWidth);
        var viewportHeight = Math.max(1, window.innerHeight || document.documentElement.clientHeight);
        var portraitAspect = 9 / 16;
        var width = viewportWidth;
        var height = width / portraitAspect;

        if (height > viewportHeight) {
          height = viewportHeight;
          width = height * portraitAspect;
        }

        container.style.width = Math.floor(width) + "px";
        container.style.height = Math.floor(height) + "px";
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      function lockPortrait() {
        if (!screen.orientation || !screen.orientation.lock) {
          return;
        }

        try {
          var request = screen.orientation.lock("portrait");
          if (request && request.catch) {
            request.catch(function () {});
          }
        } catch (e) {}
      }

      function requestFullscreenOnce() {
        if (fullscreenRequested || window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone) {
          return;
        }

        fullscreenRequested = true;
        var target = document.documentElement;
        var requestFullscreen =
          target.requestFullscreen ||
          target.webkitRequestFullscreen ||
          target.msRequestFullscreen;

        if (requestFullscreen) {
          try {
            var request = requestFullscreen.call(target);
            if (request && request.then) {
              request.then(function () {
                lockPortrait();
                setTimeout(lockViewport, 120);
              }).catch(function () {});
            } else {
              lockPortrait();
              setTimeout(lockViewport, 120);
            }
          } catch (e) {}
        } else {
          lockPortrait();
        }
      }

      window.addEventListener("resize", lockViewport);
      window.addEventListener("orientationchange", function () {
        lockPortrait();
        setTimeout(lockViewport, 250);
      });
      document.addEventListener("fullscreenchange", function () {
        lockPortrait();
        setTimeout(lockViewport, 120);
      });
      document.addEventListener("webkitfullscreenchange", function () {
        lockPortrait();
        setTimeout(lockViewport, 120);
      });
      window.addEventListener("pageshow", lockViewport);
      document.addEventListener("click", requestFullscreenOnce);
      document.addEventListener("touchend", requestFullscreenOnce);
      document.addEventListener("gesturestart", function (event) {
        event.preventDefault();
      });
      document.addEventListener("touchmove", function (event) {
        event.preventDefault();
      }, { passive: false });
      lockViewport();

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") {
          div.style.background = "#ff6961";
        } else {
          div.style.background = type == "warning" ? "#ffd166" : "#ffffff";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var ztBuildVersion = "1789145304";
      var ztCacheVersionKey = "ZT_WEBGL_BUILD_VERSION";
      var buildUrl = "Build";
      var versionQuery = "v=" + encodeURIComponent(ztBuildVersion);

      function withBuildVersion(url) {
        return url + (url.indexOf("?") >= 0 ? "&" : "?") + versionQuery;
      }

      function clearBuildCachesIfNeeded() {
        var previousVersion = "";
        try {
          previousVersion = localStorage.getItem(ztCacheVersionKey) || "";
        } catch (e) {}

        if (previousVersion === ztBuildVersion) {
          return Promise.resolve();
        }

        var jobs = [];
        if (window.caches && caches.keys) {
          jobs.push(
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key); }));
            }).catch(function () {})
          );
        }

        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          jobs.push(
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(registrations.map(function (registration) {
                return registration.update().catch(function () {});
              }));
            }).catch(function () {})
          );
        }

        return Promise.all(jobs).then(function () {
          try {
            localStorage.setItem(ztCacheVersionKey, ztBuildVersion);
          } catch (e) {}
        });
      }

      var loaderUrl = withBuildVersion(buildUrl + "/zarrintakhte-webgl.loader.js");
      var config = {
        arguments: [],
        dataUrl: withBuildVersion(buildUrl + "/zarrintakhte-webgl.data.unityweb"),
        frameworkUrl: withBuildVersion(buildUrl + "/zarrintakhte-webgl.framework.js.unityweb"),
        codeUrl: withBuildVersion(buildUrl + "/zarrintakhte-webgl.wasm.unityweb"),
        streamingAssetsUrl: "StreamingAssets",
        companyName: "saam",
        productName: "Zarrin Takhte",
        productVersion: "4.0",
        showBanner: unityShowBanner,
        cacheControl: function (url) {
          if (/\.bundle$/.test(url) || /\.data(\.|\?|$)/.test(url) || /\.wasm(\.|\?|$)/.test(url) || /\.framework\.js(\.|\?|$)/.test(url)) {
            return "must-revalidate";
          }
          return "no-store";
        }
      };

      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      document.querySelector("#unity-loading-bar").style.display = "block";

      function startUnity() {
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          }).then(function () {
            document.querySelector("#unity-loading-bar").style.display = "none";
            lockViewport();
          }).catch(function (message) {
            alert(message);
          });
        };

        document.body.appendChild(script);
      }

      clearBuildCachesIfNeeded().then(startUnity).catch(startUnity);
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js?v=" + encodeURIComponent(ztBuildVersion)).catch(function () {});
        });
      }
    </script>
  </body>
</html>
