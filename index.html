<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Zarrin Takhte">
    <meta name="theme-color" content="#151216">
    <meta name="screen-orientation" content="portrait">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Zarrin Takhte">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" sizes="192x192" href="TemplateData/icon-192.png">
    <link rel="icon" sizes="512x512" href="TemplateData/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="TemplateData/apple-touch-icon.png">
    <title>Zarrin Takhte</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #151216;
        color: #fff;
        font-family: Arial, sans-serif;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }

      #unity-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100dvh;
        min-height: 100vh;
        padding:
          env(safe-area-inset-top)
          env(safe-area-inset-right)
          env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
        background: #151216;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #151216;
        outline: none;
      }

      #unity-loading-bar {
        position: fixed;
        left: 50%;
        top: 50%;
        width: min(72vw, 360px);
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 10;
      }

      #unity-logo {
        width: 96px;
        height: 96px;
        margin: 0 auto 22px;
        border-radius: 24px;
        background: #151216 url("TemplateData/app-icon.png") center / contain no-repeat;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      }

      #unity-progress-bar-empty {
        width: 100%;
        height: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
      }

      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #f4d991, #d8a344);
        transition: width 160ms ease;
      }

      #unity-warning {
        position: fixed;
        left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right));
        top: max(12px, env(safe-area-inset-top));
        z-index: 20;
        display: none;
        font-size: 13px;
        line-height: 1.4;
      }

      #unity-warning div {
        margin-bottom: 8px;
        border-radius: 8px;
        padding: 10px 12px;
        color: #101010;
      }

      #rotate-warning {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #151216;
        text-align: center;
        font-size: 18px;
        line-height: 1.7;
      }

      @media (orientation: landscape) and (max-height: 540px) {
        #rotate-warning {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo" aria-hidden="true"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="rotate-warning">لطفاً گوشی را عمودی بگیرید</div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var fullscreenRequested = false;

      function lockViewport() {
        var width = Math.max(1, window.innerWidth || container.clientWidth);
        var height = Math.max(1, window.innerHeight || container.clientHeight);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        container.style.height = height + "px";
      }

      function requestFullscreenOnce() {
        if (fullscreenRequested || window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone) {
          return;
        }

        fullscreenRequested = true;
        var target = document.documentElement;
        var requestFullscreen =
          target.requestFullscreen ||
          target.webkitRequestFullscreen ||
          target.msRequestFullscreen;

        if (requestFullscreen) {
          try {
            var request = requestFullscreen.call(target);
            if (request && request.catch) {
              request.catch(function () {});
            }
          } catch (e) {}
        }
      }

      window.addEventListener("resize", lockViewport);
      window.addEventListener("orientationchange", function () {
        setTimeout(lockViewport, 250);
      });
      window.addEventListener("pageshow", lockViewport);
      document.addEventListener("click", requestFullscreenOnce);
      document.addEventListener("touchend", requestFullscreenOnce);
      document.addEventListener("gesturestart", function (event) {
        event.preventDefault();
      });
      document.addEventListener("touchmove", function (event) {
        event.preventDefault();
      }, { passive: false });
      lockViewport();

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") {
          div.style.background = "#ff6961";
        } else {
          div.style.background = type == "warning" ? "#ffd166" : "#ffffff";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/ZarinTakhte WebBuild.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/ZarinTakhte WebBuild.data.unityweb",
        frameworkUrl: buildUrl + "/ZarinTakhte WebBuild.framework.js.unityweb",
        codeUrl: buildUrl + "/ZarinTakhte WebBuild.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "saam",
        productName: "Zarrin Takhte",
        productVersion: "4.0",
        showBanner: unityShowBanner
      };

      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then(function () {
          document.querySelector("#unity-loading-bar").style.display = "none";
          lockViewport();
        }).catch(function (message) {
          alert(message);
        });
      };

      document.body.appendChild(script);

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
